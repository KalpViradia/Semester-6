<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <h2>Difference Between let and var</h2>
    <p id="output"></p>

    <script>
      function varExample() {
        if (true) {
          var x = 10;
        }
        return "Value of x (var): " + x;
      }

      function letExample() {
        if (true) {
          let y = 20;
        }
        try {
          return "Value of y (let): " + y;
        } catch (error) {
          return "Error: y is not accessible outside its block (let is block-scoped)";
        }
      }

      document.getElementById("output").innerHTML = varExample() + "<br>" + letExample();
    </script>
  </body>
</html>
