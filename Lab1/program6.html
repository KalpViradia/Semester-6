<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <div id="output"></div>

    <script>
        let n = parseInt(prompt("Enter a number"));
        let result = "";

        for (let i = 1; i <= n; i++) {

            for (let s = 1; s <= n - i; s++) {
                result += " ";
            }

            for (let j = 1; j <=i; j++) {
                result += n-j+1 + " ";  
            }

            result += "\n";
        }

        document.getElementById("output").innerHTML = "<pre>" + result + "</pre>";
    </script>
</body>
</html>
