<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f2f2f2;
        }

        .box {
            width: 300px;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4a90e2;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #3b7bc0;
        }

        #msg {
            margin-top: 10px;
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>Login</h3>
  
        <input id="user" type="text" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

    <div id="msg"></div>

    <script>
    function login() {
        let u = document.getElementById("user").value;
        let p = document.getElementById("pass").value;
        let msg = document.getElementById("msg");

        if (u === "" || p === "") {
            msg.innerText = "Please fill all fields";
        } else if (u === "admin" && p === "123") {
            msg.style.color = "green";
            msg.innerText = "Login successful";
        } else {
            msg.style.color = "red";
            msg.innerText = "Incorrect username or password";
        }
    }
    </script>
</div>
</body>
</html>
