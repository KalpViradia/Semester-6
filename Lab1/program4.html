<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script>
        let c = parseInt(prompt("Enter the temperature in celsius:"));

        let f = (c * (9/5)) + 32;
        document.write("Temperature in fahrenheit: ", f);
    </script>
</body>
</html>
