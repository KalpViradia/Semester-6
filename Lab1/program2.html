<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter lower bound:"));
        let b = parseInt(prompt("Enter upper bound:"));
        
        console.log("Prime numbers:");
        for (let i = a; i <= b; i++) {
            isPrime = true;

            for (let j = 2; j <= i/2; j++) {
                if (i % j == 0) {
                    isPrime = false;
                    break;
                }
            }
            if (isPrime) {
                console.log(i);
            }
            
        }
    </script>
</body>
</html>
