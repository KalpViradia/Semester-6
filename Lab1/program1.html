<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter a number:"));
        let isPrime = true;

        for (let i = 2; i <= n/2; i++) {
            if (n % i == 0) {
                isPrime = false;
                break;
            }
        }
        if (isPrime) {
            document.write("Prime number");
        }
        else {
            document.write("Not prime number");
        }
    </script>
</body>
</html>
