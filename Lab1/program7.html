<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <div id="output"></div>
    
    <script>
        let n = parseInt(prompt("Enter a number"))
        let result = ""
        for(i = 1;i<=n;i++){
            s = ""
            for(k=1;k<=i-1;k++){
                s+=" "
            }
            if(i%2==1){
                for(j=1;j<=n-i+1;j++){
                    s+="* "
                }
            }
            else if(i%2==0){
                for(j=1;j<=n-i+1;j++){
                    s+="@ "
                }
            }
            result += s + "\n"
        }

        document.getElementById("output").innerHTML = "<pre>" + result + "</pre>"
    </script>
</body>
</html>
